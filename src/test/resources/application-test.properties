spring.datasource.url=jdbc:h2:mem:mobilesco_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
app.openapi.public-access=false

security.jwt.issuer=mobilesco
security.jwt.access-ttl-minutes=15
security.jwt.refresh-ttl-days=30
security.jwt.secret-base64=uJ+Gm85KR5D9TXbzOo85js/uo0/8GK0zvlPNYsdL/gAb5fkch2uQS32R/aoYsTXNOgk/XLoweQGRX07u7yAttA==
security.refresh-token.cookie-secure=false
security.refresh-token.cookie-same-site=Lax
security.refresh-token.legacy-response-enabled=false
security.cors.allowed-origins=http://localhost:5173

app.uploads.dir=./target/uploads-test
app.uploads.max-image-bytes=20971520
app.uploads.max-image-pixels=25000000
app.uploads.max-filename-length=128

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
