server.port=8081
spring.profiles.active=${SPRING_PROFILE:dev}

# Flyway es la unica autoridad para crear o evolucionar el esquema.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.out-of-order=false

# Solo debe activarse durante el primer despliegue de una instalacion existente
# despues de ejecutar el preflight documentado. Las bases vacias no lo necesitan.
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1
spring.flyway.baseline-description=existing installation before Flyway

# Superficies de documentacion cerradas por defecto. El perfil dev puede habilitarlas.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
app.openapi.public-access=false

# Limites seguros por defecto para cualquier perfil adicional.
app.uploads.dir=${UPLOAD_DIR:./uploads}
app.uploads.max-image-bytes=${UPLOAD_MAX_IMAGE_BYTES:20971520}
app.uploads.max-image-pixels=${UPLOAD_MAX_IMAGE_PIXELS:25000000}
app.uploads.max-filename-length=${UPLOAD_MAX_FILENAME_LENGTH:128}

# Flete: Routes API se invoca solo desde el servidor. Origen fijo de Mobilesco.
app.google.maps.api-key=${GOOGLE_MAPS_API_KEY:}
app.flete.origen-nombre=${FLETE_ORIGEN_NOMBRE:Rosales, 42110 Santiago Tlapacoya, Hgo.}
app.flete.origen-lat=${FLETE_ORIGEN_LAT:20.109986478309487}
app.flete.origen-lng=${FLETE_ORIGEN_LNG:-98.8268290353736}
