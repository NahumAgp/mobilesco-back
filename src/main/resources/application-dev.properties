# =========================
# DATABASE
# =========================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/erp_mobilesco?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# JPA
# =========================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =========================
# SWAGGER
# =========================
springdoc.api-docs.enabled=${OPENAPI_ENABLED:true}
springdoc.swagger-ui.enabled=${OPENAPI_ENABLED:true}
app.openapi.public-access=${OPENAPI_PUBLIC_ACCESS:true}

# =========================
# JWT
# =========================
security.jwt.issuer=mobilesco
security.jwt.access-ttl-minutes=15
security.jwt.refresh-ttl-days=30
security.jwt.secret-base64=${JWT_SECRET_BASE64:uJ+Gm85KR5D9TXbzOo85js/uo0/8GK0zvlPNYsdL/gAb5fkch2uQS32R/aoYsTXNOgk/XLoweQGRX07u7yAttA==}

# =========================
# UPLOADS
# =========================
app.uploads.dir=${UPLOAD_DIR:./uploads}
app.uploads.max-image-bytes=${UPLOAD_MAX_IMAGE_BYTES:20971520}
app.uploads.max-image-pixels=${UPLOAD_MAX_IMAGE_PIXELS:25000000}
app.uploads.max-filename-length=${UPLOAD_MAX_FILENAME_LENGTH:128}

# MULTIPART
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

server.address=0.0.0.0
