# ==========================
# BASE DE DATOS (DOCKER)
# ==========================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================
# HIBERNATE
# ==========================
# En produccion validamos el esquema ya migrado; no lo modificamos automaticamente.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.jpa.open-in-view=false

# ==========================
# SWAGGER OFF
# ==========================
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
app.openapi.public-access=false

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000

# ==========================
# JWT
# ==========================
security.jwt.issuer=mobilesco
security.jwt.access-ttl-minutes=15
security.jwt.refresh-ttl-days=30
security.jwt.secret-base64=${JWT_SECRET_BASE64}

# ==========================
# UPLOADS
# ==========================
app.uploads.dir=${UPLOAD_DIR:/app/uploads}
app.uploads.max-image-bytes=${UPLOAD_MAX_IMAGE_BYTES:20971520}
app.uploads.max-image-pixels=${UPLOAD_MAX_IMAGE_PIXELS:25000000}
app.uploads.max-filename-length=${UPLOAD_MAX_FILENAME_LENGTH:128}

# MULTIPART
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

server.address=0.0.0.0
